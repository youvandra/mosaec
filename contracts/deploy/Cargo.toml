[package]
name = "mosaec-deploy"
description = "Idempotent deploy of the Mosaec pack code and registry, dry-run first."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
mosaec-shared.workspace = true
near-sdk = { workspace = true, features = ["non-contract-usage"] }
near-crypto = "0.38"
near-jsonrpc-client = "0.23"
near-jsonrpc-primitives = "0.38"
near-primitives = "0.38"
near-token = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
